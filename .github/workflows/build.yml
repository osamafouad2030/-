name: Mishkat Al-Durr Al-Maknun CI/CD Build Pipeline

on:
  push:
    tags:
      - 'v*' # يعمل التفعيل التلقائي للبناء عند إنشاء وسم إصدار جديد (e.g. v1.0.0) كما هو مطلوب
  workflow_dispatch: # يسمح بتشغيل خط البناء يدوياً للمطورين

jobs:
  build-android:
    name: Build Signed Android Release (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew
        continue-on-error: true # نتأكد من تجاوز الأخطاء إن كان الملف معداً سابقاً

      - name: Decrypt Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
        continue-on-error: true # يسمح للبناء بالمرور في بيئات الاختبار بدون أسرار

      - name: Build Signed APK
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      - name: Build App Bundle (AAB)
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace
        continue-on-error: true

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mishkat-signed-releases
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
